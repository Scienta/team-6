server.port=8080

# The database comes from PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD. sslmode is off for the
# Compose Postgres here; the Dockerfile sets PGSSLMODE=require for the container.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cfp}?sslmode=${PGSSLMODE:disable}
spring.datasource.username=${PGUSER:cfp}
spring.datasource.password=${PGPASSWORD:cfp}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always

# Deploy contract: /health is 200 only if the database answers within 5 s. Tests lower it to save time;
# HealthContractTest keeps it at 5 here.
health.db-timeout-seconds=5

management.endpoints.web.exposure.include=health,info

# Kept from the 2019 setup, the mobile client depends on some of these.
# Spring Boot 4 names (were server.error.include-message, server.error.include-binding-errors and
# server.servlet.encoding.force; Boot 4 ignores the old names without a warning).
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.servlet.encoding.force=true

# JSON: behave as on Boot 2.7 / Jackson 2 (workflow/specs/spring-boot-4.md, R2 "nothing changes").
# Jackson 3 changes defaults: trailing content after the JSON is rejected, properties are sorted
# alphabetically, dates without an explicit format are written with Z.
spring.jackson.use-jackson2-defaults=true
# The ones we rely on, stated explicitly as well (UpgradeContractTest pins them):
spring.jackson.json.read.allow-java-comments=true
spring.jackson.mapper.sort-properties-alphabetically=false
spring.jackson.deserialization.fail-on-trailing-tokens=false

